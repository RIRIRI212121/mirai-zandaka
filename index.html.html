<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>みらい残高・完全版</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#172338;background:#f4f6fa}
    *{box-sizing:border-box}
    body{margin:0}
    .wrap{max-width:720px;margin:auto;padding:18px 14px 110px}
    h1{font-size:23px;margin:5px 0 4px}
    h2{font-size:19px;margin:0 0 14px}
    .muted{font-size:12px;color:#69758a}
    .page{display:none}
    #nav-home:checked ~ #home, #nav-shift:checked ~ #shift, #nav-subs:checked ~ #subs{display:block}
    .card{background:white;border:1px solid #e4e8f0;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #20305008}
    label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
    input,select{width:100%;padding:12px;font-size:16px;border:1px solid #cbd5e1;border-radius:9px;background:white}
    button{background:#6154d8;color:white;border:0;border-radius:10px;padding:13px 16px;font-weight:700;font-size:15px;margin-top:12px;width:100%}
    button.secondary{background:#eef0fa;color:#433c91}
    button.delete{background:#fff0f0;color:#b62e42;padding:8px;margin:0;width:auto}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metric{font-size:28px;font-weight:800;margin:8px 0}
    .line{padding:11px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:8px;align-items:center}
    .line:last-child{border:0}
    .pie{height:210px;width:210px;border-radius:50%;margin:15px auto;background:#e6e9f2}
    .legend{font-size:14px}
    .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px}
    
    /* カレンダー用スタイル（支出金額表示対応） */
    .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
    .day{padding:6px 2px;text-align:center;background:#edf0fa;color:#24314a;border:1px solid #dbe0ea;border-radius:7px;min-height:55px;font-size:13px;margin:0;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
    .day.selected{background:#6154d8;color:white}
    .day.selected .cal-expense{color:#ffe4e6;background:rgba(255,255,255,0.2)}
    .day.worked{border:2px solid #1a9e81}
    .cal-day-num{font-weight:bold}
    .cal-expense{font-size:10px;color:#b62e42;background:#ffe4e6;border-radius:3px;padding:1px;overflow:hidden;text-overflow:ellipsis}

    .notice{font-size:13px;color:#56647a;line-height:1.6}
    .status{color:#087e61;font-size:14px;font-weight:700;margin-top:8px;min-height:20px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .row button{margin:0;width:auto}
    .subitem{border-left:5px solid var(--accent,#6154d8);padding-left:12px}
    .small{font-size:12px;color:#69758a}
    .spacer{height:10px}
    .shift-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .gear{font-size:25px;cursor:pointer;list-style:none;background:#eef0fa;border-radius:12px;padding:8px 13px;user-select:none}
    .gear::-webkit-details-marker{display:none}
    .settings{background:#f7f8ff;border:1px solid #dce0f5;border-radius:12px;padding:14px;margin:12px 0}
    .settings-note{font-size:12px;color:#5a657a;line-height:1.6}
    .settings-save{width:100%}
    .topnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 20px}
    .topnav label{display:block;text-align:center;text-decoration:none;padding:19px 5px;border-radius:12px;border:2px solid #6255d9;background:#fff;color:#372ca6;font-weight:800;font-size:17px;touch-action:manipulation;cursor:pointer}
    .topnav label:active{background:#e9e5ff}
    .nav-choice{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
    #nav-home:checked ~ .topnav label[for="nav-home"], #nav-shift:checked ~ .topnav label[for="nav-shift"], #nav-subs:checked ~ .topnav label[for="nav-subs"]{background:#6255d9;color:white}
  </style>
</head>
<body>
<div class="wrap">
  <h1>みらい残高</h1>
  <p class="muted">iPhone対応版｜カレンダー・支出連携・シフト管理</p>

  <input class="nav-choice" type="radio" name="nav" id="nav-home" checked>
  <input class="nav-choice" type="radio" name="nav" id="nav-shift">
  <input class="nav-choice" type="radio" name="nav" id="nav-subs">
  
  <nav class="topnav" aria-label="画面切り替え">
    <label for="nav-home">家計簿</label>
    <label for="nav-shift">シフト</label>
    <label for="nav-subs">サブスク</label>
  </nav>

  <!-- 家計簿ページ -->
  <section class="page" id="home">
    <div class="card">
      <h2>家計簿</h2>
      <form id="expenseForm" onsubmit="return false">
        <label>金額（円）</label>
        <input id="amount" type="number" min="1" required>
        <label>カテゴリー</label>
        <select id="category">
          <option>食費</option><option>日用品</option><option>交通費</option><option>娯楽</option>
          <option>交際費</option><option>衣服・美容</option><option>サブスク</option><option>その他</option>
        </select>
        <label>メモ</label>
        <input id="memo" type="text">
        <label>日付</label>
        <input id="date" type="date" required>
        <button type="button" data-save="1">保存して反映</button>
        <div class="status" id="expenseStatus"></div>
      </form>
    </div>

    <div class="card">
      <h2>支出の円グラフ</h2>
      <div class="metric" id="expenseTotal">¥0</div>
      <div class="pie" id="pie"></div>
      <div id="legend" class="legend"></div>
      <div id="expenseList"></div>
    </div>

    <div class="card">
      <h2>みらい残高</h2>
      <label>計算の起点となる残高（円）</label>
      <input id="balance" type="number" min="0" placeholder="例：100000">
      <p class="small">ここに入力した残高から、登録済み家計簿の全支出を差し引きます。</p>
      <div class="metric" id="futureBalance">¥0</div>
      <div class="small" id="balanceDetail"></div>
    </div>
  </section>

  <!-- シフト管理ページ -->
  <section class="page" id="shift">
    <div class="card">
      <div class="shift-head">
        <h2>シフト管理</h2>
        <details id="shiftSettings">
          <summary class="gear" aria-label="シフト設定">⚙️</summary>
          <div class="settings">
            <h3>給与設定</h3>
            <label>基本時給（円）</label><input id="settingWage" type="number" min="1" value="1200">
            <label>1勤務あたりの交通費（円）</label><input id="settingTransport" type="number" min="0" value="0">
            <label>土曜日の特別手当（円／勤務）</label><input id="settingSaturday" type="number" min="0" value="0">
            <label>日曜日の特別手当（円／勤務）</label><input id="settingSunday" type="number" min="0" value="0">
            <label>深夜割増率（％）</label><input id="settingNight" type="number" min="0" max="200" step="1" value="25">
            <button type="button" id="saveShiftSettings" class="settings-save">設定を保存</button>
            <div id="settingsStatus" class="status"></div>
          </div>
        </details>
      </div>
      <div class="row">
        <button class="secondary" id="prev" type="button">前月</button>
        <strong id="monthLabel">2026年10月</strong>
        <button class="secondary" id="next" type="button">翌月</button>
      </div>
      <p class="small">日付をタップしてシフトを登録（支出がある日は金額が表示されます）</p>
      
      <div class="calendar" id="calendar"></div>

      <p class="small" id="calendarHelp">日付を選択すると、下のシフト入力欄が更新される。</p>
      <div class="metric" id="monthlyPay">¥0</div>
      <div class="small">当月の給与見込み（交通費込み・額面）</div>
    </div>

    <div class="card">
      <h2 id="selectedLabel">シフト入力</h2>
      <form id="shiftForm" onsubmit="return false">
        <label>開始時刻</label><input id="start" type="time" value="09:00" required>
        <label>終了時刻</label><input id="end" type="time" value="17:00" required>
        <label>休憩時間（分）</label><input id="break" type="number" min="0" value="60" required>
        <label>深夜帯の休憩（分）</label><input id="nightBreak" type="number" min="0" value="0" required>
        <label>時給（円）</label><input id="wage" type="number" min="1" placeholder="1200" required>
        <label>交通費（円）</label><input id="transport" type="number" min="0" value="0" required>
        <label>土日特別手当（円）</label><input id="weekendBonus" type="number" min="0" value="0">
        <label>メモ</label><input id="shiftMemo" type="text">
        <button type="button" data-save="1">シフトを保存</button>
        <button class="secondary delete" type="button" id="removeShift" style="width:100%; margin-top:8px;">この日のシフトを削除</button>
        <div class="status" id="shiftStatus"></div>
      </form>
    </div>
  </section>

  <!-- サブスク管理ページ -->
  <section class="page" id="subs">
    <div class="card">
      <h2>サブスク管理</h2>
      <form id="subForm" onsubmit="return false">
        <label>サブスクの名称</label><input id="subName" type="text" required placeholder="例：Spotify">
        <label>金額（円）</label><input id="subAmount" type="number" min="1" required>
        <label>請求周期</label><select id="subCycle"><option value="monthly">毎月</option><option value="yearly">毎年</option></select>
        <label>引き落とし日</label><input id="subDay" type="number" min="1" max="31" value="1">
        <label>年払いの請求月</label>
        <select id="subMonth">
          <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option>
          <option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option>
          <option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
        </select>
        <button type="button" data-save="1">サブスクを保存</button>
        <div class="status" id="subStatus"></div>
      </form>
    </div>
    <div class="card">
      <h2>契約中のサブスク</h2>
      <div class="small">月額換算</div>
      <div class="metric" id="subTotal">¥0</div>
      <div id="subList"></div>
    </div>
  </section>
</div>

<script>
(function(){
  'use strict';
  var key='mirai-iphone-anchor-v1';
  var settingsKey='mirai-shift-settings-v1';
  var settings={wage:1200,transport:0,saturday:0,sunday:0,night:25};
  
  try{
    var storedSettings=JSON.parse(localStorage.getItem(settingsKey));
    if(storedSettings) settings=Object.assign(settings,storedSettings);
  }catch(e){}

  var data={expenses:[],shifts:{},subs:[],balance:0};
  try{
    var saved=JSON.parse(localStorage.getItem(key));
    if(saved&&typeof saved==='object') data=Object.assign(data,saved);
    if(!Array.isArray(data.expenses)) data.expenses=[];
    if(!Array.isArray(data.subs)) data.subs=[];
    if(!data.shifts||typeof data.shifts!=='object') data.shifts={};
  }catch(e){}

  function save(){
    try{
      localStorage.setItem(key,JSON.stringify(data));
      return true;
    }catch(e){
      alert('保存できませんでした。ブラウザのストレージ容量を確認してください。');
      return false;
    }
  }

  function yen(n){return '¥'+Math.round(n).toLocaleString('ja-JP')}
  function el(id){return document.getElementById(id)}
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function today(){
    var d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  el('date').value=today();
  el('balance').value=data.balance||'';
  el('balance').addEventListener('change',function(){
    data.balance=Number(this.value)||0;
    save();
    renderExpenses();
  });

  var colors=['#6154d8','#16a58a','#ef8e4a','#e45d7a','#4b9be5','#e1b44a','#8e7caa','#64748b'];

  function renderExpenses(){
    data.expenses=data.expenses.filter(function(e){return Number(e.amount)>0});
    var total=data.expenses.reduce(function(a,e){return a+(Number(e.amount)||0)},0);
    el('expenseTotal').textContent=yen(total);
    el('futureBalance').textContent=yen((Number(data.balance)||0)-total);
    el('balanceDetail').textContent=yen(Number(data.balance)||0)+' − '+yen(total);

    var grouped={};
    data.expenses.forEach(function(e){
      var cat=String(e.category||'その他');
      grouped[cat]=(grouped[cat]||0)+(Number(e.amount)||0);
    });

    var entries=Object.keys(grouped).map(function(k){return [k,grouped[k]]});
    var angle=0, stops=[];
    entries.forEach(function(p,i){
      var slice=total>0?360*(p[1]/total):0;
      var end=angle+slice;
      if(slice>0) stops.push(colors[i%colors.length]+' '+angle+'deg '+end+'deg');
      angle=end;
    });
    el('pie').style.background=stops.length?'conic-gradient('+stops.join(',')+')':'#e6e9f2';
    el('legend').innerHTML=entries.map(function(p,i){return '<div class="line"><span><i class="swatch" style="background:'+colors[i%colors.length]+'"></i>'+esc(p[0])+'</span><b>'+yen(p[1])+'</b></div>'}).join('');
    el('expenseList').innerHTML=data.expenses.slice().reverse().map(function(e){return '<div class="line"><span>'+esc(e.date)+' '+esc(e.category)+'<br><span class="small">'+esc(e.memo)+'</span></span><b>'+yen(e.amount)+'</b></div>'}).join('');
    
    // 支出が更新されたらカレンダーの表示も更新する
    renderCalendar();
  }

  el('expenseForm').querySelector('[data-save]').addEventListener('click',function(e){
    e.preventDefault();
    var amount=Number(el('amount').value);
    var dateValue=el('date').value;
    if(!(amount>0)||!dateValue){el('expenseStatus').textContent='金額と日付を入力してください';return;}
    data.expenses.push({amount:amount,category:el('category').value,memo:el('memo').value.trim(),date:dateValue});
    var ok=save();
    renderExpenses();
    el('expenseStatus').textContent=(ok?'保存しました：':'保存エラー：')+yen(amount)+'（'+el('category').value+'）';
    el('amount').value='';
    el('memo').value='';
  });

  function bonusFor(s){
    var day=new Date(s+'T12:00:00').getDay();
    return day===6?Number(settings.saturday)||0:day===0?Number(settings.sunday)||0:0;
  }

  el('saveShiftSettings').addEventListener('click',function(){
    var w=Number(el('settingWage').value),t=Number(el('settingTransport').value),sat=Number(el('settingSaturday').value),sun=Number(el('settingSunday').value),n=Number(el('settingNight').value);
    if(!(w>0)){el('settingsStatus').textContent='時給は0円より大きくしてください';return;}
    settings={wage:w,transport:t,saturday:sat,sunday:sun,night:n};
    try{
      localStorage.setItem(settingsKey,JSON.stringify(settings));
      el('settingsStatus').textContent='設定を保存しました';
    }catch(e){el('settingsStatus').textContent='保存エラー';}
  });

  var view=new Date(), selected=today();

  function selectDate(s){
    selected=s;
    el('selectedLabel').textContent=s+' のシフト';
    var v=data.shifts[s]||{};
    el('start').value=v.start||'09:00';
    el('end').value=v.end||'17:00';
    el('break').value=v.breakMin==null?60:v.breakMin;
    el('nightBreak').value=v.nightBreak||0;
    el('wage').value=v.wage==null?settings.wage:v.wage;
    el('transport').value=v.transport==null?settings.transport:v.transport;
    el('weekendBonus').value=v.weekendBonus==null?bonusFor(s):v.weekendBonus;
    el('shiftMemo').value=v.memo||'';
    el('shiftStatus').textContent='';
    renderCalendar();
  }

  function pay(v){
    var a=v.start.split(':').map(Number), b=v.end.split(':').map(Number);
    var s=a[0]*60+a[1], end=b[0]*60+b[1];
    if(end<=s) end+=1440;
    var duration=end-s;
    var rest=Math.min(duration,Math.max(0,Number(v.breakMin)||0));
    var worked=duration-rest;
    var night=0;
    for(var t=s; t<end; t++){
      var hour=(t%1440)/60;
      if(hour>=22||hour<5) night++;
    }
    night=Math.max(0,night-Math.max(0,Number(v.nightBreak)||0));
    night=Math.min(night,worked);
    return Math.round(worked/60*v.wage + night/60*v.wage*(v.nightRate==null?.25:v.nightRate/100) + (Number(v.transport)||0) + (Number(v.weekendBonus)||0));
  }

  function renderCalendar(){
    var y=view.getFullYear(), m=view.getMonth();
    el('monthLabel').textContent=y+'年'+(m+1)+'月';
    var first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    
    // 日付ごとの支出合計をマッピング
    var expenseMap={};
    data.expenses.forEach(function(e){
      if(!expenseMap[e.date]) expenseMap[e.date]=0;
      expenseMap[e.date]+=Number(e.amount)||0;
    });

    var html='';
    ['日','月','火','水','木','金','土'].forEach(function(w){
      html+='<span class="small" style="text-align:center; font-weight:bold;">'+w+'</span>';
    });
    for(var i=0; i<first; i++) html+='<span></span>';

    for(var d=1; d<=days; d++){
      var date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var isSelected=(date===selected);
      var hasShift=!!data.shifts[date];
      var expAmount=expenseMap[date]||0;

      html+='<button type="button" class="day'+(isSelected?' selected':'')+(hasShift?' worked':'')+'" data-date="'+date+'">';
      html+='<span class="cal-day-num">'+d+'</span>';
      if(expAmount>0){
        html+='<span class="cal-expense">'+yen(expAmount)+'</span>';
      }else{
        html+='<span></span>';
      }
      html+='</button>';
    }

    el('calendar').innerHTML=html;
    el('calendar').querySelectorAll('[data-date]').forEach(function(b){
      b.addEventListener('click',function(){
        selectDate(this.getAttribute('data-date'));
      });
    });

    var total=0;
    Object.keys(data.shifts).forEach(function(k){
      if(k.slice(0,7)===y+'-'+String(m+1).padStart(2,'0')) total+=pay(data.shifts[k]);
    });
    el('monthlyPay').textContent=yen(total);
  }

  el('prev').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar();};
  el('next').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar();};

  el('shiftForm').querySelector('[data-save]').addEventListener('click',function(e){
    e.preventDefault();
    var v={
      start:el('start').value,
      end:el('end').value,
      breakMin:Number(el('break').value),
      nightBreak:Number(el('nightBreak').value),
      wage:Number(el('wage').value),
      transport:Number(el('transport').value),
      weekendBonus:Number(el('weekendBonus').value),
      nightRate:settings.night,
      memo:el('shiftMemo').value
    };
    data.shifts[selected]=v;
    save();
    renderCalendar();
    el('shiftStatus').textContent='保存しました：見込み '+yen(pay(v));
  });

  el('removeShift').onclick=function(){
    delete data.shifts[selected];
    save();
    selectDate(selected);
  };

  function renderSubs(){
    var total=0;
    el('subList').innerHTML=data.subs.map(function(s,i){
      total+=s.cycle==='yearly'?s.amount/12:s.amount;
      return '<div class="line subitem" style="--accent:'+colors[i%colors.length]+'"><span><b>'+esc(s.name)+'</b><br><span class="small">'+(s.cycle==='yearly'?'毎年'+s.month+'月':'毎月')+s.day+'日</span></span><span><b>'+yen(s.amount)+'</b><br><button type="button" class="delete" data-index="'+i+'">削除</button></span></div>';
    }).join('');
    el('subTotal').textContent=yen(total);
    el('subList').querySelectorAll('[data-index]').forEach(function(b){
      b.onclick=function(){
        data.subs.splice(Number(this.getAttribute('data-index')),1);
        save();
        renderSubs();
      };
    });
  }

  el('subForm').querySelector('[data-save]').addEventListener('click',function(e){
    e.preventDefault();
    var s={name:el('subName').value.trim(),amount:Number(el('subAmount').value),cycle:el('subCycle').value,day:Number(el('subDay').value),month:Number(el('subMonth').value)};
    if(!s.name||!(s.amount>0)) return;
    data.subs.push(s);
    save();
    renderSubs();
    el('subStatus').textContent='保存しました：'+s.name;
    el('subName').value='';
    el('subAmount').value='';
  });

  // 初期化実行
  el('settingWage').value=settings.wage;
  el('settingTransport').value=settings.transport;
  el('settingSaturday').value=settings.saturday;
  el('settingSunday').value=settings.sunday;
  el('settingNight').value=settings.night;

  renderExpenses();
  selectDate(selected);
  renderSubs();
})();
</script>
</body>
</html>
